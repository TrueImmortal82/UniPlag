<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — UniPlag</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="centered">
<div class="card login-card" style="width: 380px; padding: 28px;">
  <h1 style="margin: 0; font-size: 26px;">🛡 UniPlag</h1>
  <p class="muted" style="margin: 6px 0 18px 0; font-size: 14px;">Университетская система анализа оригинальности и интеллектуального вклада</p>
  
  {% if error %}<div class="alert" style="margin-bottom: 14px;">{{ error }}</div>{% endif %}
  
  <form method="post" action="/login">
    <label style="text-align: left;">Логин
      <input id="login-username" name="username" required autofocus placeholder="admin / teacher / student">
    </label>
    <label style="text-align: left;">Пароль
      <input id="login-password" name="password" type="password" required placeholder="••••••••">
    </label>
    <button type="submit" class="btn wide" style="margin-top: 16px; padding: 11px;">Войти в систему</button>
  </form>

  <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #e2e8f0; text-align: left;">
    <span class="muted" style="font-size: 12px; display: block; margin-bottom: 8px; font-weight: 600;">БЫСТРЫЙ ДЕМО-ВХОД:</span>
    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12px;">
      <a href="#" onclick="fillLogin('admin', 'admin123'); return false;" style="text-decoration: none; padding: 5px 8px; background: #fdf2f8; border-radius: 5px; color: #be185d;">
        👑 <b>Администратор:</b> admin / admin123
      </a>
      <a href="#" onclick="fillLogin('teacher', 'teacher123'); return false;" style="text-decoration: none; padding: 5px 8px; background: #eff6ff; border-radius: 5px; color: #1d4ed8;">
        🎓 <b>Преподаватель:</b> teacher / teacher123
      </a>
      <a href="#" onclick="fillLogin('student', 'student123'); return false;" style="text-decoration: none; padding: 5px 8px; background: #f0fdf4; border-radius: 5px; color: #15803d;">
        🎒 <b>Студент:</b> student / student123
      </a>
    </div>
  </div>
</div>

<script>
function fillLogin(u, p) {
  document.getElementById('login-username').value = u;
  document.getElementById('login-password').value = p;
}
</script>
</body>
</html>
